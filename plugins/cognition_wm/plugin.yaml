name: cognition_wm
version: 0.1.0
description: "Working memory (cognition v2): keeps each task's state, the user's limits, cancellations and permissions, and tool evidence across turns, resumed chats and compaction. The snapshot rides the current user message; the system prompt never changes mid-conversation."
author: "Hermes cognition v2"
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - pre_tool_call
provides_tools:
  - task_state
config_schema:
  snapshot_max_chars:
    type: int
    default: 1600
    description: "Most characters of task state added to a user message."
  other_open_tasks_max:
    type: int
    default: 3
    description: "Other open tasks of the project listed in the snapshot."
  authorization_historical_after_hours:
    type: number
    default: 12
    description: "A permission older than this, or given in an earlier run, must be confirmed again."
  scope_gate:
    type: bool
    default: true
    description: "Keep execution tools inside what the user asked for."
  cancelled_under_yolo:
    type: str
    choices: [block, approve]
    default: block
    description: "Execution tools on a paused or cancelled task: block, or ask (which /yolo skips)."
  learning:
    type: bool
    default: false
    description: "Learn how the user wants work done from their corrections and our own verified results, and recall it for similar tasks."
  calibration:
    type: bool
    default: false
    description: "Keep a track record of claimed results per task kind, model and Hermes version; a poor record adds a check."
  lessons_max:
    type: int
    default: 3
    description: "Most lessons added to a user message."
  lessons_max_chars:
    type: int
    default: 600
    description: "Most characters of lessons added to a user message."
  calibration_min_samples:
    type: int
    default: 5
    description: "Results needed before a track record says anything or changes anything."
  expire_after_days:
    type: number
    default: 30
    description: "An unconfirmed lesson with no support for this long expires."
  stale_after_days:
    type: number
    default: 90
    description: "A lesson with no support for this long goes stale and is no longer recalled."
